name: Step 16 AdaptaBrasil Tier-A risk refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/fetch/fetch_adaptabrasil_tierA.py'
      - '.github/workflows/step16_adaptabrasil.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python src/fetch/fetch_adaptabrasil_tierA.py
      - uses: actions/upload-artifact@v4
        with:
          name: step16-adaptabrasil-tierA
          path: data/processed/step16_adaptabrasil_tierA_risk_v1.csv
      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/step16_adaptabrasil_tierA_risk_v1.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Step-16 AdaptaBrasil Tier-A risk"
            git push
          fi
