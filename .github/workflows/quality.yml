name: Project consistency tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'data/processed/**'
      - 'data/templates/**'
      - 'src/scoring/**'
      - 'src/validation/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'data/processed/**'
      - 'data/templates/**'
      - 'src/scoring/**'
      - 'src/validation/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pandas pytest
      - name: Run tests
        run: pytest -q
