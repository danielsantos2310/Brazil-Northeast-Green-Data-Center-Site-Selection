name: Debug EPE ArcGIS geometry

on:
  push:
    paths:
      - ".github/workflows/debug-epe-geometry.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WFS and WMS ArcGIS geometry
        run: |
          python - <<'PY'
          import json
          import requests

          targets = [
              ("WFS", "https://gisepeprd2.epe.gov.br/arcgis/rest/services/SMA/WFS_Webmap_EPE/MapServer/20/query"),
              ("WMS", "https://gisepeprd2.epe.gov.br/arcgis/rest/services/SMA/WMS_Webmap_EPE/MapServer/21/query"),
          ]
          base = {
              "where": "1=1",
              "outFields": "*",
              "returnGeometry": "true",
              "outSR": "4674",
              "resultRecordCount": 1,
              "f": "geojson",
          }
          for label, url in targets:
              r = requests.get(url, params=base, timeout=60)
              print("SERVICE", label, "STATUS", r.status_code, "URL", r.url)
              payload = r.json()
              feat = payload.get("features", [{}])[0]
              geom = feat.get("geometry")
              print("TOP KEYS", list(payload.keys()))
              print("FEATURE KEYS", list(feat.keys()))
              print("GEOMETRY", json.dumps(geom, ensure_ascii=False)[:2000])
              print("PROPERTIES", json.dumps(feat.get("properties"), ensure_ascii=False)[:1000])
          PY
