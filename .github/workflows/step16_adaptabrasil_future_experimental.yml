name: Experimental AdaptaBrasil future scenarios

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Probe official future-scenario metadata
        run: python src/fetch/fetch_adaptabrasil_tierA_future.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: step16-adaptabrasil-future-experimental
          path: data/processed/step16_adaptabrasil_tierA_future_risk_v1.csv
