name: Fetch Global Wind Atlas Northeast subset

on:
  push:
    paths:
      - ".github/workflows/fetch-gwa-northeast.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install raster dependencies
        run: python -m pip install --disable-pip-version-check requests rasterio

      - name: Build Northeast source subsets
        run: python src/fetch/download_gwa_northeast.py --output-dir gwa_raw

      - name: Verify GeoTIFF subsets and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import rasterio

          root = Path("gwa_raw")
          manifest = json.loads(
              (root / "gwa4_northeast_manifest.json").read_text(encoding="utf-8")
          )
          assert len(manifest["resources"]) == 2
          for row in manifest["resources"]:
              path = root / row["subset_filename"]
              assert path.exists()
              assert path.stat().st_size == row["subset_bytes"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row["subset_sha256"]
              with rasterio.open(path) as src:
                  assert src.width == row["subset_window"]["width"]
                  assert src.height == row["subset_window"]["height"]
                  assert src.crs is not None
                  assert src.count == 1
                  print(
                      row["name"],
                      "shape=", (src.height, src.width),
                      "crs=", src.crs,
                      "bytes=", path.stat().st_size,
                      "min/max sample pending zonal analysis",
                  )
          PY

      - name: Upload GWA Northeast source subset artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwa4-brazil-northeast-100m
          path: gwa_raw/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
