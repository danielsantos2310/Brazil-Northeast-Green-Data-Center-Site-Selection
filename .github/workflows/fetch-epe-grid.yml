name: Fetch EPE grid infrastructure

on:
  push:
    paths:
      - ".github/workflows/fetch-epe-grid.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download official EPE grid layers
        run: python src/fetch/download_epe_grid.py --output-dir epe_raw

      - name: Verify files and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("epe_raw")
          manifest = json.loads((root / "epe_grid_manifest.json").read_text(encoding="utf-8"))
          assert len(manifest) == 4, len(manifest)

          for row in manifest:
              path = root / row["filename"]
              assert path.exists(), path
              assert path.stat().st_size == row["bytes"], row["filename"]
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              assert h == row["sha256"], row["filename"]
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["type"] == "FeatureCollection"
              assert len(payload["features"]) == row["feature_count"]
              print(row["layer_name"], row["feature_count"], row["bytes"], row["sha256"])
          PY

      - name: Upload raw EPE artifact
        uses: actions/upload-artifact@v4
        with:
          name: epe-grid-infrastructure
          path: epe_raw/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
